<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b32">
<title>115適應體育｜工作人員手冊已關閉</title>
<style>
  :root { --ink: #123b32; --muted: #4a6a60; --bg: #f6f4ee; --card: #fff; --line: #dfe6e2; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e4efe9; --muted: #a9c0b7; --bg: #0f1d19; --card: #162823; --line: #2a3f38; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.7;
  }
  main {
    width: 100%; max-width: 30rem; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 36px 28px; text-align: center;
  }
  .tag { font-size: .85rem; color: var(--muted); letter-spacing: .08em; margin: 0 0 8px; }
  h1 { font-size: 1.6rem; margin: 0 0 16px; line-height: 1.35; }
  p { margin: 0 0 10px; color: var(--muted); }
  .thanks { margin-top: 20px; color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <p class="tag">新竹縣115年度適應體育活動</p>
  <h1>工作人員手冊已關閉</h1>
  <p>本手冊提供至 11/6（五）14:30，活動已結束，網頁不再開放瀏覽。</p>
  <p>活動相關文件由承辦學校竹東國中保存。</p>
  <p class="thanks">謝謝各位夥伴兩天的協助！</p>
</main>
</body>
</html>
