<!DOCTYPE html>

<title>10/21 自然代課</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f3ef;color:#222;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:17px;line-height:1.55}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:28px 16px 56px}
  .hd{margin-bottom:22px}
  .hd small{display:block;color:#888;font-size:14px;letter-spacing:.08em}
  .hd h1{margin:2px 0 4px;font-size:30px;letter-spacing:.02em}
  .hd p{margin:0;color:#555;font-size:16px}
  h2{font-size:15px;color:#888;font-weight:700;letter-spacing:.08em;margin:26px 0 10px}
  .papers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .paper{background:#fff;border:1px solid #e2ded6;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .paper .th{display:block;aspect-ratio:210/150;overflow:hidden;background:#eee;border-bottom:1px solid #eee}
  .paper .th img{width:100%;display:block}
  .paper .nm{padding:8px 10px 2px;font-weight:700;font-size:16px}
  .paper .ln{padding:0 10px 10px;font-size:14px;color:#1a4f8b;display:flex;gap:12px}
  .paper .ln a{text-decoration:underline}
  .deck{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-block;background:#fff;border:1px solid #cfcac0;border-radius:8px;padding:10px 16px;font-weight:700}
  .btn.p{background:#222;color:#fff;border-color:#222}
  .cls{background:#fff;border:1px solid #e2ded6;border-radius:12px;margin-bottom:14px;overflow:hidden}
  .ch{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid #eee}
  .tag{font-size:14px;font-weight:700;color:#fff;border-radius:6px;padding:2px 9px}
  .tag.a{background:#b4432f}.tag.b{background:#2f5f8f}
  .ch b{font-size:19px}.ch span.t{color:#888;font-size:15px;margin-left:auto}
  .prep{padding:8px 16px 0;color:#666;font-size:15px}
  ol{list-style:none;margin:0;padding:6px 8px 10px;counter-reset:s}
  ol li a{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:8px;font-size:18px;font-weight:700}
  ol li a:hover{background:#f5f3ef}
  ol li a::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:#222;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
  ol li a::after{content:"›";margin-left:auto;color:#bbb;font-size:22px}
  ol li a small{font-weight:400;color:#888;font-size:14px}
  .gate,.ended{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:80vh;text-align:center}
  .gate input{font-size:22px;letter-spacing:.3em;text-align:center;width:140px;padding:6px;border:1px solid #888;border-radius:6px}
  .gate button{font-size:17px;padding:6px 20px;border:1px solid #888;border-radius:6px;background:#fff;cursor:pointer}
  .err{color:#b00;min-height:1.4em;font-size:15px}
  .hide{display:none!important}
  @media (max-width:560px){.papers{gap:8px}.paper .nm{font-size:13px;padding:6px 7px 0}.paper .ln{font-size:12.5px;padding:0 7px 8px;gap:8px}.hd h1{font-size:26px}ol li a{font-size:17px}}
.date{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border:1px solid #e2ded6;border-radius:12px;margin-bottom:14px}.date .d{flex:none;width:76px;text-align:center;border-right:1px solid #eee;padding-right:14px}.date .d b{display:block;font-size:34px;line-height:1.05}.date .d span{font-size:14px;color:#888}.date .i{flex:1}.date .i b{font-size:19px}.date .i div{color:#666;font-size:15px;margin-top:2px}.date .go{flex:none;background:#222;color:#fff;border-radius:8px;padding:10px 18px;font-weight:700}.tip{color:#666;font-size:15px;margin:10px 4px 0}.back{display:inline-block;margin-bottom:10px;color:#1a4f8b;font-size:15px}</style>
</head>
<body>
<script>if(Date.now()>=Date.parse("2026-10-21T15:45:00+08:00")){document.documentElement.innerHTML='<meta charset="utf-8"><body style="background:#fff;color:#222;font:20px sans-serif;display:grid;place-items:center;height:100vh;margin:0">本頁已關閉</body>';window.stop();}</script>
<div class="gate" id="gate"><div>請輸入通關碼</div><input id="code" inputmode="numeric" maxlength="4" autocomplete="off"><button id="open">確定</button><div class="err" id="err"></div></div>
<div class="wrap hide" id="main">
  <div class="hd"><small>自然科代課</small><h1>10/21（三）</h1><p>甲班第 7 節・20 分鐘</p></div>
  <div class="cls">
    <div class="ch"><span class="tag a">甲班</span><b>第 7 節</b><span class="t">15:00–15:20</span></div>
    <div class="prep">準備：額溫槍 2–3 支、酒精棉片、學習單、<a href="files/T2-card.pdf?v=2" target="_blank" rel="noopener">溫度尺小卡</a></div>

</div>
<script>(function(){const $=id=>document.getElementById(id);const U=Date.parse("2026-10-21T15:45:00+08:00"),H="9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0",K="sub_"+location.pathname;function ok(){$("gate").classList.add("hide");$("main").classList.remove("hide");try{localStorage.setItem(K,String(U));}catch(e){}}try{if(+localStorage.getItem(K)===U)ok();}catch(e){}async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}async function go(){if(await sha($("code").value.trim())===H)ok();else{$("err").textContent="通關碼不正確";$("code").select();}}$("open").onclick=go;$("code").addEventListener("keydown",e=>{if(e.key==="Enter")go();});})();</script>
